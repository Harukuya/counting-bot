# 每天记一次博客（www.noctuna.cc）在 Vercount 上的累计访问量 / 访客数，追加到 data/visits.json。
# 博客侧栏「网站资讯」卡片经 jsDelivr 读它，画近 30 天的每日访问量曲线（博客 source/js/visits-chart.js）；
# 每次提交后顺手刷新 jsDelivr 的缓存（不然它最多缓存 12 小时）。2026-11-06 从图床仓库 blogpic 搬到这里。
# 只用 GET 读总数，不会改动计数（Vercount 禁止用脚本改计数）。
#
# 每条记录：date = 这次记的是哪一天的收尾（北京时间往回推 6 小时取日期：00:05 的定时记到前一天，白天手动跑记到当天，
# 同一天再跑会覆盖那天的记录），pv / uv = 那一刻的累计总数，t = 记录时刻。某天的访问量 = 当天 pv - 前一天 pv。
name: 记录访问量

on:
  schedule:
    - cron: '5 16 * * *'   # 每天北京时间 00:05（UTC 16:05）；GitHub 的定时任务有时会晚几十分钟
  workflow_dispatch:       # 也可以在 Actions 页面手动跑
  push:
    paths: ['.github/workflows/visits.yml']   # 改这个文件时顺手跑一次

permissions:
  contents: write

concurrency: visits

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读 Vercount 的总数，记进 data/visits.json
        run: |
          python3 - <<'EOF'
          import datetime, json, os, urllib.parse, urllib.request
          SITE = 'https://www.noctuna.cc/'
          api = 'https://events.vercount.one/api/v2/log?url=' + urllib.parse.quote(SITE, safe='')
          req = urllib.request.Request(api, headers={'User-Agent': 'blogpic-visits-snapshot'})
          with urllib.request.urlopen(req, timeout=30) as r:
              d = json.load(r)
          if d.get('status') != 'success' or 'data' not in d:
              raise SystemExit('Vercount 没返回数据：' + json.dumps(d, ensure_ascii=False))
          pv, uv = int(d['data']['site_pv']), int(d['data']['site_uv'])
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          day = (now - datetime.timedelta(hours=6)).strftime('%Y-%m-%d')
          path = 'data/visits.json'
          data = {'site': SITE, 'days': []}
          if os.path.exists(path):
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
          days = [x for x in data.get('days', []) if x.get('date') != day]
          days.append({'date': day, 'pv': pv, 'uv': uv, 't': now.isoformat(timespec='seconds')})
          days.sort(key=lambda x: x['date'])
          data['days'] = days[-400:]
          os.makedirs('data', exist_ok=True)
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=1)
              f.write('\n')
          print(day, 'pv', pv, 'uv', uv)
          EOF

      - name: 有变化就提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add data/visits.json
          if git diff --cached --quiet; then echo '没有变化'; exit 0; fi
          git commit -m "访问量记录：$(TZ=Asia/Shanghai date +%F)"
          git push

      - name: 刷新 jsDelivr 缓存
        if: success()
        run: curl -fsS --max-time 30 'https://purge.jsdelivr.net/gh/Harukuya/counting-bot@main/data/visits.json' || echo '刷新失败（不影响数据，最多晚 12 小时更新）'
